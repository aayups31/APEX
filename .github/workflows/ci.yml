name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apex_engine/pyproject.toml
      - name: Install APEX
        run: python -m pip install -e './apex_engine[dev,data-contracts,optimization,forecasting]'
      - name: Lint
        run: ruff check apex_engine/src apex_engine/tests
      - name: Test
        working-directory: apex_engine
        run: pytest -q
      - name: Compile Airflow wrapper
        working-directory: apex_engine
        run: python -m py_compile dags/apexsim_dag.py
      - name: Verify public-data artifacts
        run: python -m apexsim.cli public-data-demo --output .cache/ci-public-data
      - name: Verify permanent benchmark reservation
        run: python -m apexsim.cli verify-benchmark-reservation apex_engine/src/apexsim/data/benchmark_policy.json
      - name: Verify causal tyre-study and posterior artifacts
        run: python -m apexsim.cli tyre-degradation-smoke --output .cache/ci-tyre-degradation
      - name: Verify robust tyre observation ensembles
        run: python -m apexsim.cli robust-tyre-demo --baseline .cache/ci-tyre-degradation --output .cache/ci-robust-tyre --profile smoke
      - name: Verify matched six-family forecasting and checkpoint reload
        run: python -m apexsim.cli tyre-forecast-smoke --output .cache/ci-tyre-forecast
      - name: Verify frozen seen/unseen track inference and clustered confidence
        run: python -m apexsim.cli track-generalization-smoke --reference .cache/ci-tyre-forecast --output .cache/ci-track-generalization
      - name: Freeze simulated explanation cohort without reading model outcomes
        run: python -m apexsim.cli freeze-forecast-explanation-cohort --reference .cache/ci-tyre-forecast --evaluation .cache/ci-track-generalization --profile smoke --output .cache/ci-explanation-cohort.json
      - name: Verify frozen-model explanation and constrained counterfactual study
        run: python -m apexsim.cli forecast-explanation-study --reference .cache/ci-tyre-forecast --evaluation .cache/ci-track-generalization --cohort .cache/ci-explanation-cohort.json --output .cache/ci-forecast-explanations
      - name: Reload and audit all simulated explanation and counterfactual outputs
        run: python -m apexsim.cli verify-forecast-explanation-study .cache/ci-forecast-explanations
      - name: Independently audit explanation equations and scenario validity
        run: python -m apexsim.cli audit-forecast-explanation-study .cache/ci-forecast-explanations
      - name: Verify periodic reference geometry and held-out reconstruction
        run: python -m apexsim.cli track-reconstruction-smoke --output .cache/ci-track-reconstruction
      - name: Verify observed track support partial boundaries and rigid shape registration
        run: python -m apexsim.cli track-reconstruction-v2-smoke --observed-boundaries --coherent-curvature --output .cache/ci-track-reconstruction-v3
      - name: Verify longitudinal calibration source split and frozen section replay
        run: python -m apexsim.cli longitudinal-calibration-smoke --output .cache/ci-longitudinal-calibration
      - name: Independently audit longitudinal convex fits and DOP853 integration
        run: python -m apexsim.cli audit-longitudinal-calibration .cache/ci-longitudinal-calibration
      - name: Verify synthetic bicycle forces stability and explicit support abstention
        run: python -m apexsim.cli bicycle-dynamics-study --output .cache/ci-bicycle-dynamics
      - name: Replay every bicycle equation gate and trajectory
        run: python -m apexsim.cli verify-bicycle-dynamics .cache/ci-bicycle-dynamics
      - name: Independently audit bicycle DOP853 motion and grip-limit support exit
        run: python -m apexsim.cli audit-bicycle-dynamics .cache/ci-bicycle-dynamics
      - name: Verify smooth lap-map artifacts
        run: python -m apexsim.cli smooth-lap-demo --output .cache/ci-smooth-lap
      - name: Verify matched strategy-solver artifacts
        run: python -m apexsim.cli strategy-solver-demo --output .cache/ci-strategy-solver
      - name: Verify SAC training and checkpoint artifacts
        run: python -m apexsim.cli sac-strategy-demo --profile smoke --output .cache/ci-sac-strategy
      - name: Verify frozen-policy disturbance artifacts
        run: python -m apexsim.cli strategy-scenarios-demo --policy-run .cache/ci-sac-strategy --output .cache/ci-strategy-scenarios


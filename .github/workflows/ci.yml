name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apex_engine/pyproject.toml
      - name: Install APEX
        run: python -m pip install -e './apex_engine[dev]'
      - name: Lint
        run: ruff check apex_engine/src apex_engine/tests
      - name: Test
        working-directory: apex_engine
        run: pytest -q
      - name: Compile Airflow wrapper
        working-directory: apex_engine
        run: python -m py_compile dags/apexsim_dag.py


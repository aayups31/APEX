project_name: Project APEX
seed: 7
artifacts_dir: artifacts/runs
data:
  source: synthetic
  raw_dir: data/raw
  processed_dir: data/processed
  sample_hz: 5
  sessions: 12
  laps_per_session: 5
  track_length_m: 5300
  session_seconds: 300
  train_fraction: 0.67
  val_fraction: 0.16
  test_fraction: 0.17
  sequence_length: 48
  prediction_horizon: 12
model:
  kind: gru
  hidden_dim: 96
  latent_dim: 24
  layers: 2
  dropout: 0.1
training:
  epochs: 12
  batch_size: 96
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 4
  device: cpu
  max_train_windows: 9000
simulation:
  rollout_steps: 150
  throttle_scale: 1.0
  brake_scale: 1.0
  grip_multiplier: 1.0
  rain_delta: 0.0
  tyre_degradation_multiplier: 1.0

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexsim"
version = "0.3.0"
description = "Hybrid F1 telemetry world model and race simulation engineering kit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "gradio>=5.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.27"
]

[project.optional-dependencies]
real-data = ["fastf1>=3.6", "pyarrow>=15"]
airflow = ["apache-airflow>=3.0"]
pretrained = ["transformers>=4.45", "chronos-forecasting>=1.4"]
research = ["xgboost>=2.0", "optuna>=3.6", "gymnasium>=0.29"]
optimization = ["casadi>=3.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
apexsim = "apexsim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
